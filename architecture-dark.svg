<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="790" viewBox="0 0 1620 790" role="img" aria-label="apply.sh builds a Samba mini-AD domain controller for wbuilder.workspaces.com in a private subnet behind a NAT gateway, an AD Connector that points at it, and a WorkSpaces directory whose new WorkSpaces land in the Build_Workspaces OU. The Admin user's WBuilder WorkSpace joins the domain through the connector; a startup GPO linked to that OU registers its SSM agent with a hybrid activation, so it appears in Systems Manager as a managed instance. The scripts then send Run Command documents that install the AD tools, Chrome and Notepad++, reboot the WorkSpace, capture a custom image from it and create a custom bundle from the image. Secrets Manager holds the Admin password, which Terraform gives the AD Connector, and the hybrid activation ID and code."><defs><marker id="a_e_send" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_run" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8d6e8"/></marker><marker id="a_e_img" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_join" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_ldap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_gpo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_nat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8d6e8"/></marker></defs><rect width="1620" height="790" fill="#0d1117"/><path d="M600,95.0 H250.0 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_send)"/><text x="425.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">send-command</text><path d="M1020,95.0 H1370.0 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_mk)"/><text x="1195.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">create image + bundle</text><path d="M460,295.0 H595" fill="none" stroke="#c8d6e8" stroke-width="2" marker-end="url(#a_e_run)"/><text x="530.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c8d6e8" stroke="#0d1117" stroke-width="6" paint-order="stroke">Run Command</text><path d="M1020,295.0 H1155" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_img)"/><text x="1090.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">captured</text><path d="M810.0,350 V435" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_join)"/><text x="824.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">join + Admin logon</text><path d="M1020,495.0 H1155" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_ldap)"/><text x="1090.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">DNS, LDAP</text><path d="M1370.0,440 V383.0 H980 V355" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_gpo)"/><text x="1175.0" y="403.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">startup GPO: SSM register</text><path d="M600,495.0 H465" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_sec)"/><text x="530.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">Admin password</text><path d="M1370.0,550 V635" fill="none" stroke="#c8d6e8" stroke-width="2" marker-end="url(#a_e_nat)"/><text x="1384.0" y="601.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c8d6e8" stroke="#0d1117" stroke-width="6" paint-order="stroke">outbound</text><rect x="600" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#c8d6e8" stroke-width="2"/><g transform="translate(620,80.0) scale(1.25)" fill="none" stroke="#c8d6e8" stroke-width="2" stroke-linecap="round" stro